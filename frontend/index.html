<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1a15" />
    <meta
      name="description"
      content="面向《算法设计与分析》课程的算法评审平台：编程题自动评测、主观题匿名互评、学习过程分析与异常评审检测"
    />
    <title>涅槃 · 算法设计与分析课程评审平台</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/logo.svg"
    />
    <link rel="apple-touch-icon" href="./assets/logo.svg" />
    <link rel="stylesheet" href="./css/app.css" />
    <script>
      // 支持部署在子路径（例如 http://host/algo/）：自动把当前路径前缀识别为 API base，
      // 这样同一份代码既能跑在根路径，也能挂在 nginx 子路径下。
      (function () {
        var m = location.pathname.match(/^(.*\/)(?:index\.html)?$/);
        var base = m && m[1] ? m[1] : "/";
        if (base !== "/") window.AJP_API_BASE = base.replace(/\/$/, "");
      })();
      // 静态演示模式：没有后端时自动切到内置数据引擎（GitHub Pages）；
      // 也可以显式加 ?demo=1 强制预览演示模式。
      window.__AJP_DEMO__ =
        location.protocol === "file:" ||
        window.AJP_FORCE_DEMO === true ||
        new URLSearchParams(location.search).has("demo");
    </script>
  </head>
  <body>
    <div id="app" class="app-root">
      <div class="boot">
        <img class="boot__logo" src="./assets/logo.svg" alt="涅槃" width="56" height="56" />
        <div class="boot__text">正在加载算法评审平台…</div>
      </div>
    </div>
    <div id="toasts" class="toast-layer"></div>
    <div id="overlays" class="overlay-layer"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
