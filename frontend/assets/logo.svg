<!--
  涅槃 Nirvana · 平台标识（原创设计，非任何赛事 logo 的复刻）

  取「凤凰涅槃、向上展翼」之意：
  · 每侧两片刀锋状羽翼，由肩部向外上方扬起，翼尖高于肩线，
    外长内短形成层叠的镂空剪影——缩到 16px 仍能认出「展翼」的轮廓；
  · 中央是一束自下而上收束的火芯，底部收成尖尾，顶部一颗金色冠羽；
  · 胸口嵌一枚金色菱形，作为「火种 / 重生」的点睛，也是深绿底上的高对比焦点；
  · 配色沿用平台设计令牌：深松绿到薄荷绿渐变（#0b3a2d → #1eb27c），火种用暖金。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="img" aria-label="涅槃 Nirvana">
  <defs>
    <linearGradient id="nirvana-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a2d" />
      <stop offset="0.55" stop-color="#12684c" />
      <stop offset="1" stop-color="#1eb27c" />
    </linearGradient>
    <linearGradient id="nirvana-feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#dffbee" />
      <stop offset="1" stop-color="#9ff0cd" />
    </linearGradient>
    <linearGradient id="nirvana-ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0" />
      <stop offset="1" stop-color="#dc9c33" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#nirvana-badge)" />
  <rect x="0.6" y="0.6" width="46.8" height="46.8" rx="12.6" fill="none"
        stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />

  <!-- 双翼：每侧两片刀锋羽，外长内短 -->
  <g fill="url(#nirvana-feather)">
    <path d="M22.6 27.8L3.4 5.4l3.0 12.2 2.0 8.2z" />
    <path d="M22.6 27.8L12.2 8.4l1.4 10.4 1.0 6.6z" />
    <path d="M25.4 27.8L44.6 5.4l-3.0 12.2-2.0 8.2z" />
    <path d="M25.4 27.8L35.8 8.4l-1.4 10.4-1.0 6.6z" />
    <!-- 火芯：中央收束的身体 -->
    <path d="M24 12.2c2.6 5.6 3.9 10.5 3.9 14.7 0 5.2-1.3 9.8-3.9 13.9-2.6-4.1-3.9-8.7-3.9-13.9 0-4.2 1.3-9.1 3.9-14.7z" />
  </g>

  <!-- 冠羽与火种 -->
  <path d="M24 4.6l1.8 4.1-1.8 3.5-1.8-3.5z" fill="url(#nirvana-ember)" />
  <path d="M24 18.4l2.2 5.4-2.2 5.9-2.2-5.9z" fill="url(#nirvana-ember)" />
</svg>
